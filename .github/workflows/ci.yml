name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  dart:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed --line-length 100 lib test

      - name: Analyze
        # Warnings are failures here: the lint set is chosen to catch the async and lifecycle
        # mistakes that are invisible until they bite in production.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        # Golden images depend on the host's graphics stack, so they are verified deliberately
        # rather than on every CI machine.
        run: flutter test --exclude-tags golden

  android:
    name: Build Android and run native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Native unit tests
        # Covers the /proc/self/stat parser and the CPU utilisation arithmetic.
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APK
        # Without android/key.properties this signs with the debug key and is not publishable;
        # it exists to prove the release pipeline, including R8, still builds.
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
