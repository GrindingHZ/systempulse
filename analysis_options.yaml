include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - windows/**
    - web/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Anything that would make a release build misbehave is an error in CI, not a suggestion.
    invalid_use_of_visible_for_testing_member: error
    unawaited_futures: error

linter:
  rules:
    # Async correctness. Most of the defects fixed in this rewrite were unawaited or
    # improperly-sequenced futures, so these are enforced rather than advisory.
    # avoid_slow_async_io is deliberately NOT enabled: it recommends the synchronous dart:io
    # methods, which block the calling isolate. In an app that is the UI thread, so following it
    # would trade a dropped frame for a lint.
    - unawaited_futures
    - discarded_futures
    - use_build_context_synchronously

    # Correctness.
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally

    # Consistency.
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - use_super_parameters
